name: Publish

on:
  release:
    types: [created]
  pull_request:
    branches:
      - 'main'

jobs:
  publish:
    name: ${{ github.event_name == 'release' && 'Publish Release' || 'Publish Beta' }}
    if: >-
      (github.event_name == 'release' && github.event.action == 'created') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Check Label
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-label@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Imports
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-imports@main
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Audit Signatures
        run: npm audit signatures
      - name: Prepare
        run: npm run prepare
      - name: Run Test
        if: github.event_name == 'pull_request'
        run: npm run ci:test
      - name: Prepare Beta
        if: github.event_name == 'pull_request'
        id: prepare-beta
        uses: checkdigit/github-actions/prepare-beta@main
      - name: Publish Release
        if: github.event_name == 'release'
        run: npm publish
      - name: Publish Beta
        if: github.event_name == 'pull_request'
        run: npm publish --tag beta
      - name: Comment npm publish result
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/comment-npm-publish@main
        with:
          betaPackage: ${{ steps.prepare-beta.outputs.betaPackage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
